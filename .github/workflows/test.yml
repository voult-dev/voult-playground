name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      # D6: the server stays the template's: every auth route comes from @voult/express.
      - run: npm run check:backend
      - run: npm test
      - run: npm run build
